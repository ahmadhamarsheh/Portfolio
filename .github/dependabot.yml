version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) is a major jump; upgrade it deliberately, not by bot.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            'prettier*',
            'vitest',
            '@playwright/*',
            '@axe-core/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
